plugins {
	// MC 26.1+ ist unobfuscated -> unobfuscated Loom-Plugin (nicht der kurze 'fabric-loom'-Alias = remap-Variante)
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

println "Building for Minecraft ${project.minecraft_version} (Mojang mappings, Loader: ${project.loader_version}, API: ${project.fabric_version})"

repositories {
	// Cloth Config Repository
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "ParchmentMC"
		url = "https://maven.parchmentmc.org"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"packet-logger" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.1+ ist unobfuscated: keine Tiny-Mappings noetig (Loom erkennt das automatisch,
	// productionNamespace=OFFICIAL, intermediary aus). officialMojangMappings() wuerde hier werfen.
	// Unobfuscated (26.1+): kein Remap -> keine mod*-Konfigurationen, normales implementation.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Die einzelnen Module werden fürs Kompilieren gebraucht, da die JIJ-Nested-Jars
	// aus dem Meta-Paket bei 'implementation' nicht auf den Compile-Classpath gelangen.
	implementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
	implementation fabricApi.module("fabric-key-mapping-api-v1", project.fabric_version)

	// Gson für JSON-Serialisierung (bereits in Minecraft enthalten)
	implementation "com.google.code.gson:gson:2.10.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// MC 26.x benötigt Java 25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
